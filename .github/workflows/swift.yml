name: Swift CI

on:
  push:
    branches:
      - main
      - "abs/**"
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6 toolchain
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build
        run: swift build
